[package]
name = "xen-cli"
version = "0.1.0"
edition = "2024"
description = "XEN CLI - a local-first AI agent command line interface"
license = "MIT"
repository = "https://github.com/gian-cyber-security/xen-cli"
readme = "README.md"

[[bin]]
name = "xen"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
